remote_theme: aterenin/minima-reboot
title: Yashovardhan Srivastava
description: Builder. Researcher. I rely on obsession, not talent.
permalink: /404.html
lsi: false
safe: true
google_analytics: G-ERR9VSKKLD
url: https://yash-sri.xyz
baseurl: ""

# Read by jekyll-seo-tag for link previews and search engines' structured data
author:
  name: Yashovardhan Srivastava
  url: https://yash-sri.xyz
twitter:
  username: Yaaaaaashhh
social:
  name: Yashovardhan Srivastava
  links:
    - https://github.com/yash-srivastava19
    - https://twitter.com/Yaaaaaashhh

# Blog posts: own layout (no duplicate h1), and marked as articles for search engines
defaults:
  - scope:
      path: blog
    values:
      layout: blog
      author: Yashovardhan Srivastava
      seo:
        type: BlogPosting
  # Not real content: keep them out of sitemap.xml
  - scope:
      path: 404.md
    values:
      sitemap: false
  - scope:
      path: about
    values:
      sitemap: false
footer_icons:
- username: yash-srivastava19
  url: https://github.com/yash-srivastava19
  icon: icon-github.svg

# Letterboxd integration — change username here to point at any profile
letterboxd:
  username: yash_sri19
  profile_url: https://letterboxd.com/yash_sri19/

header_pages:
  - blogs.md
  - films.md
  - diary.md
  - projects.md
  - scratchpad.md
  - contact.md

# jekyll-readme-index (bundled with github-pages) turns a directory's
# README.md into that directory's index.html. That made /diary/ serve the
# placeholder instead of diary.md. Excluded from the build; still on GitHub.
exclude:
  - diary/README.md

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
